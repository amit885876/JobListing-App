name: Visa Job Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: visa-job-radar
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r visa-job-radar/requirements.txt
      - name: Collect raw jobs, validate sources, then score
        working-directory: visa-job-radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.run
      - name: Build dashboard
        working-directory: visa-job-radar
        run: python -m app.dashboard
      - name: Publish dashboard and diagnostics at Pages root
        run: |
          cp visa-job-radar/data/jobs.json jobs.json
          cp visa-job-radar/data/raw_jobs.json raw_jobs.json
          cp visa-job-radar/data/source_health.json source_health.json
          cp visa-job-radar/dashboard/index.html visa-job-radar-dashboard.html
          git config user.name 'visa-job-radar[bot]'
          git config user.email 'visa-job-radar[bot]@users.noreply.github.com'
          git add jobs.json raw_jobs.json source_health.json visa-job-radar/data/jobs.json visa-job-radar/data/raw_jobs.json visa-job-radar/data/source_health.json visa-job-radar/dashboard/index.html visa-job-radar-dashboard.html
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'chore: update visa job radar'
            git pull --rebase origin main
            git push
          fi
