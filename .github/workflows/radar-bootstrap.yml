name: Visa Job Radar Bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r visa-job-radar/requirements.txt
      - name: Collect and score jobs
        working-directory: visa-job-radar
        run: python -m app.run
      - name: Build dashboard
        working-directory: visa-job-radar
        run: python -m app.dashboard
      - name: Publish updated data
        run: |
          git config user.name 'visa-job-radar[bot]'
          git config user.email 'visa-job-radar[bot]@users.noreply.github.com'
          git add visa-job-radar/data/jobs.json visa-job-radar/dashboard/index.html
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'chore: update visa job radar data'
            git push
          fi
